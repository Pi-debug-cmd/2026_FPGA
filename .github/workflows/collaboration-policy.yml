name: collaboration-policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-round-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check task commits and communication record
        run: >-
          python tools/check_collaboration_policy.py
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          --head "${{ github.event.pull_request.head.sha || github.sha }}"
