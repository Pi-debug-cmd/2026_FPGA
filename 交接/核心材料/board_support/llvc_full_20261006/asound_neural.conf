</usr/share/alsa/alsa.conf>

pcm.neural_play_hw {
    type mmap_emul
    slave.pcm "hw:0,0"
}
pcm.neural_cap_hw {
    type mmap_emul
    slave.pcm "hw:0,1"
}
pcm.neural_play {
    type plug
    slave {
        pcm "neural_play_hw"
        format S24_LE
        channels 2
        rate 44100
    }
}
pcm.neural_capture {
    type plug
    slave {
        pcm "neural_cap_hw"
        format S24_LE
        channels 2
        rate 44100
    }
}
